<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMIYA 田宫迷你四驱车产品目录 | 全型号规格对比</title>
<style>
:root{
  --bg:#0a0e1a;--card:#131826;--card2:#1a2033;--border:#252b3d;
  --txt:#e8eaf0;--txt2:#9ca3b5;--txt3:#5a6178;
  --accent:#e60012;--accent2:#ff3b3b;--blue:#1e90ff;--green:#2ecc71;--gold:#f1c40f;--purple:#9b59b6;
  --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* Header */
header{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav{max-width:1400px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo-mark{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:900}
.logo-text{background:linear-gradient(90deg,#fff,#9ca3b5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:4px}
.nav-links button{background:none;border:none;color:var(--txt2);cursor:pointer;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;transition:.2s}
.nav-links button:hover,.nav-links button.active{color:var(--txt);background:var(--card2)}
.nav-stats{font-size:12px;color:var(--txt3);white-space:nowrap}

/* Hero */
.hero{max-width:1400px;margin:0 auto;padding:40px 20px 20px;text-align:center}
.hero h1{font-size:36px;font-weight:900;letter-spacing:-1px;margin-bottom:8px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--txt2);font-size:15px;max-width:600px;margin:0 auto}

/* Filter Bar */
.filter-bar{max-width:1400px;margin:0 auto;padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:64px;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px 10px 40px;color:var(--txt);font-size:14px;outline:none;transition:.2s}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,144,255,.15)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--txt3)}
.filter-select{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--txt);font-size:14px;cursor:pointer;outline:none}
.filter-select option{background:var(--card)}
.filter-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;transition:.2s;user-select:none}
.filter-chip:hover{border-color:var(--blue)}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.results-count{font-size:13px;color:var(--txt3);margin-left:auto;white-space:nowrap}

/* Grid */
.grid{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.25s;position:relative}
.card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow)}
.card-img{height:160px;background:linear-gradient(135deg,var(--card2),#0f1320);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-img .num{font-size:42px;font-weight:900;color:var(--txt3);opacity:.3;position:absolute}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.3s}
.card:hover .card-img img{transform:scale(1.06)}
.card-img .img-num{position:absolute;bottom:8px;left:10px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:#fff;letter-spacing:.5px;z-index:2}
.card-img .chassis-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;z-index:2}
.modal-img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:16px;background:var(--card2)}
.card-badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;z-index:2}
.card-badge.soldout{background:var(--txt3)}
.card-badge.limited{background:var(--gold);color:#000}
.card-body{padding:14px}
.card-title{font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.card-price{font-size:18px;font-weight:800;color:var(--accent2)}
.card-price small{font-size:12px;color:var(--txt3);font-weight:400}
.card-chassis{font-size:11px;color:var(--txt2);background:var(--card2);padding:3px 8px;border-radius:6px;font-weight:600}
.card-compare-btn{position:absolute;bottom:14px;right:14px;width:32px;height:32px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:16px}
.card-compare-btn:hover{border-color:var(--green);color:var(--green)}
.card-compare-btn.selected{background:var(--green);border-color:var(--green);color:#fff}
.card-compare-btn.selected::after{content:'✓';font-size:14px}

/* Compare Bar */
.compare-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:16px 20px;z-index:90;transform:translateY(120%);transition:.3s;display:flex;align-items:center;gap:12px;max-width:1400px;margin:0 auto;justify-content:center;flex-wrap:wrap}
.compare-bar.show{transform:translateY(0)}
.compare-item{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:8px;padding:6px 12px;font-size:13px}
.compare-item .remove{cursor:pointer;color:var(--txt3);font-size:16px}
.compare-item .remove:hover{color:var(--accent)}
.compare-bar button.compare-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.compare-bar button.compare-btn:hover{background:var(--accent2)}
.compare-bar button.compare-btn:disabled{background:var(--card2);color:var(--txt3);cursor:not-allowed}
.compare-clear{background:none;border:1px solid var(--border);color:var(--txt2);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:start;gap:12px}
.modal-header h2{font-size:18px;font-weight:800}
.modal-header .modal-sub{font-size:13px;color:var(--txt2);margin-top:4px}
.modal-close{background:none;border:none;color:var(--txt3);font-size:24px;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--txt)}
.modal-body{padding:20px}
.spec-table{width:100%;border-collapse:collapse}
.spec-table th{text-align:left;padding:10px 12px;background:var(--card2);font-size:12px;color:var(--txt2);font-weight:600;border-bottom:1px solid var(--border);width:40%}
.spec-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border)}
.spec-table tr:last-child td{border-bottom:none}

/* Comparison View */
.compare-view{display:none;max-width:1400px;margin:0 auto;padding:20px}
.compare-view.show{display:block}
.compare-table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border)}
.compare-table{width:100%;border-collapse:collapse;min-width:600px}
.compare-table th,.compare-table td{padding:14px 16px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:13px}
.compare-table th:last-child,.compare-table td:last-child{border-right:none}
.compare-table thead th{background:var(--card2);font-weight:700;font-size:14px;position:sticky;top:0;z-index:5}
.compare-table thead th .remove-cmp{display:block;margin:4px auto 0;cursor:pointer;color:var(--txt3);font-size:12px}
.compare-table thead th .remove-cmp:hover{color:var(--accent)}
.compare-table tbody th{text-align:left;background:var(--card2);color:var(--txt2);font-weight:600;width:160px;position:sticky;left:0;z-index:3}
.compare-table tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
.compare-table .price-cell{color:var(--accent2);font-weight:700;font-size:15px}
.compare-table .chassis-cell{font-weight:700}
.chassis-VZ{color:#e74c3c}.chassis-MA{color:#2ecc71}.chassis-MS{color:#3498db}.chassis-AR{color:#e67e22}
.chassis-FM{color:#9b59b6}.chassis-S2{color:#f1c40f}.chassis-VS{color:#1abc9c}
.chassis-Other{color:#95a5a6}

.empty-state{text-align:center;padding:60px 20px;color:var(--txt3)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.3}

/* Chassis Info Section */
.chassis-info{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.chassis-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.chassis-card h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.chassis-card .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.chassis-card dl{font-size:13px;line-height:1.8}
.chassis-card dt{color:var(--txt2);font-weight:600;display:inline-block;width:100px}
.chassis-card dd{display:inline;color:var(--txt)}

/* Responsive */
@media(max-width:768px){
  .hero h1{font-size:26px}
  .nav-stats{display:none}
  .filter-bar{top:64px;flex-direction:column;align-items:stretch}
  .results-count{margin-left:0}
}
</style>
</head>

<header>
  <div class="nav">

    <div class="nav-stats" id="navStats"></div>

</header>

<!-- HERO -->
<div class="hero" id="heroSection">
  <h1>田宫 <span>迷你四驱车</span> 全型号目录</h1>
  <p>收录田宫中国官网全部1/32迷你四驱车产品，含在售与停产型号。支持按底盘类型筛选、关键词搜索，多车规格一键对比。</p>
</div>

<!-- CATALOG VIEW -->
<div id="catalogView">
  <div class="filter-bar">

      <option value="">全部底盘</option>
    </select>
    <select class="filter-select" id="statusFilter" onchange="renderGrid()">
      <option value="">全部状态</option>
      <option value="available">在售</option>
      <option value="soldout">停产/缺货</option>
      <option value="limited">限定版</option>
    </select>
    <select class="filter-select" id="sortFilter" onchange="renderGrid()">
      <option value="newest">最新上架</option>
      <option value="price-low">价格 低→高</option>
      <option value="price-high">价格 高→低</option>
      <option value="number">编号排序</option>
    </select>
    <span class="results-count" id="resultsCount"></span>
  </div>
  <div class="grid" id="productGrid"></div>
</div>

<!-- COMPARE VIEW -->
<div class="compare-view" id="compareView">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <h2 style="font-size:22px;font-weight:800">规格对比</h2>
    <div style="display:flex;gap:10px">
      <button class="compare-clear" onclick="clearCompare()">清空选择</button>
      <button class="compare-clear" onclick="showCatalog()">返回目录</button>
    </div>
  </div>
  <div id="compareContent"></div>
</div>

<!-- CHASSIS INFO VIEW -->
<div id="chassisView" style="display:none">
  <div class="hero" style="padding-bottom:0">
    <h1 style="font-size:28px">底盘百科</h1>

  <div class="chassis-info" id="chassisInfoGrid"></div>
</div>

<!-- COMPARE BAR -->
<div class="compare-bar" id="compareBar">

  <div id="compareItems" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <button class="compare-btn" id="compareBtn" onclick="showCompare()" disabled>开始对比</button>
  <button class="compare-clear" onclick="clearCompare()">清空</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

// ============= STATE =============
let compareList = [];
let filteredProducts = [...products];

// ============= INIT =============
function init(){
  // Populate chassis filter
  const chassisTypes = [...new Set(products.map(p=>p.chassis))].sort();
  const select = document.getElementById('chassisFilter');
  chassisTypes.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = chassisData[c]?.name || c;
    select.appendChild(opt);
  });
  
  // Stats
  const available = products.filter(p=>p.status==='available').length;
  const limited = products.filter(p=>p.status==='limited').length;
  const soldout = products.filter(p=>p.status==='soldout').length;
  document.getElementById('navStats').textContent = `共 ${products.length} 款 | 在售 ${available} | 限定 ${limited} | 停产 ${soldout}`;
  
  renderGrid();
  renderChassisInfo();
}

// ============= RENDER GRID =============
function renderGrid(){
  const search = document.getElementById('searchInput').value.toLowerCase();
  const chassis = document.getElementById('chassisFilter').value;
  const status = document.getElementById('statusFilter').value;
  const sort = document.getElementById('sortFilter').value;
  
  filteredProducts = products.filter(p=>{
    if(search){
      const text = (p.num + ' ' + p.name + ' ' + p.ename + ' ' + p.chassis).toLowerCase();
      if(!text.includes(search)) return false;
    }
    if(chassis && p.chassis !== chassis) return false;
    if(status === 'available' && p.status !== 'available') return false;
    if(status === 'soldout' && p.status !== 'soldout') return false;
    if(status === 'limited' && p.status !== 'limited') return false;
    return true;
  });
  
  if(sort === 'price-low') filteredProducts.sort((a,b)=>(a.price||9999)-(b.price||9999));
  else if(sort === 'price-high') filteredProducts.sort((a,b)=>(b.price||0)-(a.price||0));
  else if(sort === 'number') filteredProducts.sort((a,b)=>a.num.localeCompare(b.num));
  
  const grid = document.getElementById('productGrid');
  document.getElementById('resultsCount').textContent = `${filteredProducts.length} 款产品`;
  
  if(filteredProducts.length === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><p>未找到匹配的产品</p></div>';
    return;
  }
  
  grid.innerHTML = filteredProducts.map((p,i)=>{
    const ch = chassisData[p.chassis] || {name:p.chassis,color:"#95a5a6"};
    const isCompared = compareList.includes(p.num);
    const badge = p.status === 'limited' ? '<div class="card-badge limited">限定</div>' : 
                  p.status === 'soldout' ? '<div class="card-badge soldout">停产</div>' : '';
    const priceStr = p.price > 0 ? `$${p.price} <small>/ ¥${p.rmb}</small>` : '<span style="color:var(--txt3)">已停产</span>';
    return `<div class="card" onclick="showDetail('${p.num}')">
      ${badge}
      <div class="card-img">
        <span class="num">${p.num}</span>
        ${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.remove()"><span class="img-num">TA ${p.num}</span>`:''}
        <span class="chassis-badge" style="color:${ch.color}">${ch.name}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-meta">
          <span class="card-price">${priceStr}</span>
          <span class="card-chassis">${ch.name}</span>
        </div>
      </div>
      <button class="card-compare-btn ${isCompared?'selected':''}" onclick="event.stopPropagation();toggleCompare('${p.num}')">${isCompared?'✓':'+'}</button>
    </div>`;
  }).join('');
}

// ============= DETAIL MODAL =============
function showDetail(num){
  const p = products.find(x=>x.num===num);
  if(!p) return;
  const ch = chassisData[p.chassis] || {name:p.chassis,motor:'-',gear:'-',dim:'-',body:'-',tire:'-',roller:'-',desc:'-'};
  const statusText = p.status==='available'?'在售':p.status==='limited'?'限定版':'已停产/缺货';
  const priceStr = p.price > 0 ? `$${p.price} (约¥${p.rmb})` : '已停产';
  const siteUrl = p.url || 'https://tamiya.cn/shop/';
  
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <div>
        <h2>${p.name}</h2>
        <div class="modal-sub">${p.ename} | 编号: ${p.num} | ${statusText}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      ${p.img?`<img class="modal-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none'">`:''}
      <table class="spec-table">
        <tr><th>产品编号</th><td>${p.num}</td></tr>
        <tr><th>产品名称</th><td>${p.name}</td></tr>
        <tr><th>英文名称</th><td>${p.ename}</td></tr>
        <tr><th>比例</th><td>1/32</td></tr>
        <tr><th>底盘类型</th><td style="color:${ch.color};font-weight:700">${ch.name}</td></tr>
        <tr><th>马达位置</th><td>${ch.motor}</td></tr>
        <tr><th>齿轮比</th><td>${ch.gear}</td></tr>
        <tr><th>车身尺寸</th><td>${ch.dim}</td></tr>
        <tr><th>车壳材质</th><td>${ch.body}</td></tr>
        <tr><th>轮胎规格</th><td>${ch.tire}</td></tr>
        <tr><th>导轮尺寸</th><td>${ch.roller}</td></tr>
        <tr><th>产品类别</th><td>${p.cat}</td></tr>
        <tr><th>销售状态</th><td>${statusText}</td></tr>
        <tr><th>价格</th><td style="color:var(--accent2);font-weight:700">${priceStr}</td></tr>
      </table>
      <div style="margin-top:16px;padding:14px;background:var(--card2);border-radius:10px;font-size:13px;color:var(--txt2);line-height:1.7">
        <strong style="color:${ch.color}">${ch.name}介绍：</strong><br>${ch.desc}
      </div>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button onclick="closeModal();toggleCompare('${p.num}')" style="flex:1;background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:10px;padding:10px;cursor:pointer;font-size:14px">${compareList.includes(p.num)?'✓ 已加入对比':'加入对比'}</button>
        <a href="${siteUrl}" target="_blank" rel="noopener" style="flex:1;background:var(--accent);color:#fff;border-radius:10px;padding:10px;text-align:center;font-size:14px;font-weight:600;text-decoration:none">查看官网</a>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

// ============= COMPARE =============
function toggleCompare(num){
  const idx = compareList.indexOf(num);
  if(idx > -1){
    compareList.splice(idx,1);
  } else {
    if(compareList.length >= 4){
      alert('最多对比4款产品');
      return;
    }
    compareList.push(num);
  }
  updateCompareBar();
  renderGrid();
}

function updateCompareBar(){
  const bar = document.getElementById('compareBar');
  const items = document.getElementById('compareItems');
  const btn = document.getElementById('compareBtn');
  document.getElementById('compareCount').textContent = compareList.length;
  
  if(compareList.length === 0){
    bar.classList.remove('show');
    btn.disabled = true;
    return;
  }
  
  bar.classList.add('show');
  btn.disabled = false;
  
  items.innerHTML = compareList.map(num=>{
    const p = products.find(x=>x.num===num);
    return `<div class="compare-item">${p.name.substring(0,12)}... <span class="remove" onclick="toggleCompare('${num}')">&times;</span></div>`;
  }).join('');
}

function clearCompare(){
  compareList = [];
  updateCompareBar();
  renderGrid();
  if(document.getElementById('compareView').classList.contains('show')) showCatalog();
}

function showCompare(){
  const cv = document.getElementById('compareView');
  if(compareList.length < 2){
    alert('请至少选择2款产品进行对比');
    return;
  }
  document.getElementById('catalogView').style.display='none';
  document.getElementById('chassisView').style.display='none';
  document.getElementById('heroSection').style.display='none';
  cv.classList.add('show');
  
  document.getElementById('nav-catalog').classList.remove('active');
  document.getElementById('nav-chassis').classList.remove('active');
  document.getElementById('nav-compare').classList.add('active');
  
  renderCompareTable();
}

function renderCompareTable(){
  const items = compareList.map(num=>products.find(x=>x.num===num));
  const specs = [
    {label:'产品编号',key:'num'},
    {label:'产品名称',key:'name'},
    {label:'英文名称',key:'ename'},
    {label:'底盘类型',key:'chassis',isChassis:true},
    {label:'马达位置',key:'motor',fromChassis:true},
    {label:'齿轮比',key:'gear',fromChassis:true},
    {label:'车身尺寸',key:'dim',fromChassis:true},
    {label:'车壳材质',key:'body',fromChassis:true},
    {label:'轮胎规格',key:'tire',fromChassis:true},
    {label:'导轮尺寸',key:'roller',fromChassis:true},
    {label:'产品类别',key:'cat'},
    {label:'销售状态',key:'status',isStatus:true},
    {label:'价格(USD)',key:'price',isPrice:true},
    {label:'价格(RMB)',key:'rmb',isPrice:true},
  ];
  
  let html = '<div class="compare-table-wrap"><table class="compare-table"><thead><tr>';
  html += '<th>规格参数</th>';
  items.forEach(p=>{
    const ch = chassisData[p.chassis] || {name:p.chassis};
    html += `<th>${p.img?`<img src="${p.img}" alt="${p.name}" style="width:86px;height:60px;object-fit:cover;border-radius:8px;margin:0 auto 6px;display:block" onerror="this.remove()">`:''}<div>${p.name.substring(0,16)}</div><div style="font-size:11px;color:${ch.color||'#999'};margin-top:2px">${ch.name||p.chassis}</div><div class="remove-cmp" onclick="toggleCompare('${p.num}');renderCompareTable();updateCompareBar()">移除</div></th>`;
  });
  html += '</tr></thead><tbody>';
  
  specs.forEach(spec=>{
    html += '<tr><th>'+spec.label+'</th>';
    items.forEach(p=>{
      let val;
      if(spec.fromChassis){
        const ch = chassisData[p.chassis] || {};
        val = ch[spec.key] || '-';
      } else if(spec.isPrice){
        val = p[spec.key] > 0 ? (spec.key==='price'?'$'+p[spec.key]:'¥'+p[spec.key]) : '-';
      } else if(spec.isStatus){
        val = p.status==='available'?'在售':p.status==='limited'?'限定版':'已停产';
      } else if(spec.isChassis){
        const ch = chassisData[p.chassis] || {name:p.chassis};
        val = ch.name || p.chassis;
      } else {
        val = p[spec.key] || '-';
      }
      let cls = '';
      if(spec.isPrice && p[spec.key] > 0) cls = 'price-cell';
      if(spec.isChassis) cls = 'chassis-cell';
      html += `<td class="${cls}">${val}</td>`;
    });
    html += '</tr>';
  });
  
  html += '</tbody></table></div>';
  document.getElementById('compareContent').innerHTML = html;
}

// ============= VIEW SWITCHING =============
function showCatalog(){
  document.getElementById('catalogView').style.display='block';
  document.getElementById('compareView').classList.remove('show');
  document.getElementById('chassisView').style.display='none';
  document.getElementById('heroSection').style.display='block';
  document.getElementById('nav-catalog').classList.add('active');
  document.getElementById('nav-compare').classList.remove('active');
  document.getElementById('nav-chassis').classList.remove('active');
}

function showChassis(){
  document.getElementById('catalogView').style.display='none';
  document.getElementById('compareView').classList.remove('show');
  document.getElementById('heroSection').style.display='block';
  document.getElementById('chassisView').style.display='block';
  document.getElementById('nav-catalog').classList.remove('active');
  document.getElementById('nav-compare').classList.remove('active');
  document.getElementById('nav-chassis').classList.add('active');
}

function renderChassisInfo(){
  const grid = document.getElementById('chassisInfoGrid');
  grid.innerHTML = Object.entries(chassisData).map(([key,ch])=>{
    return `<div class="chassis-card">
      <h3><span class="tag" style="background:${ch.color}20;color:${ch.color}">${ch.name}</span></h3>
      <dl>
        <dt>马达位置</dt><dd>${ch.motor}</dd><br>
        <dt>齿轮比</dt><dd>${ch.gear}</dd><br>
        <dt>车身尺寸</dt><dd>${ch.dim}</dd><br>
        <dt>车壳材质</dt><dd>${ch.body}</dd><br>
        <dt>轮胎规格</dt><dd>${ch.tire}</dd><br>
        <dt>导轮尺寸</dt><dd>${ch.roller}</dd>
      </dl>
      <div style="margin-top:12px;padding:12px;background:var(--card2);border-radius:10px;font-size:12px;color:var(--txt2);line-height:1.7">${ch.desc}</div>
      <div style="margin-top:10px;font-size:12px;color:var(--txt3)">
        相关产品: ${products.filter(p=>p.chassis===key).length} 款
        <a href="#" onclick="showCatalog();document.getElementById('chassisFilter').value='${key}';renderGrid();return false" style="margin-left:8px">查看 →</a>
      </div>
    </div>`;
  }).join('');
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
});

init();
</script>
</body>
</html>
